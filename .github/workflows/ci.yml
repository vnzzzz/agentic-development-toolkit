name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find .devcontainer scripts templates -name '*.sh' -type f -print)
      - name: Compile Python
        run: python -m compileall -q scripts tests templates
      - name: Validate empty local Skill workspace
        run: make validate link-skills
      - name: Test parent workspace
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install lint tools
        run: python -m pip install -r requirements-ci.txt
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Ruff lint
        run: ruff check scripts tests templates
      - name: ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t scripts < <(find .devcontainer scripts templates -name '*.sh' -type f -print)
          if ((${#scripts[@]})); then
            shellcheck "${scripts[@]}"
          fi
      - name: GitHub Actions security lint
        run: zizmor --min-severity high .github/workflows templates/skill-repository/.github/workflows
