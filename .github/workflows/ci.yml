name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Preserve existing compatibility checks and cover the Dev Container runtime.
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find .devcontainer scripts templates -name '*.sh' -type f -print)
      - name: Compile Python
        run: python -m compileall -q scripts tests templates
      - name: Validate empty local Skill workspace
        run: make validate link-skills
      - name: Test parent workspace
        run: make test

  plugin-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public marketplace is anonymously readable
        shell: bash
        run: |
          set -Eeuo pipefail
          GIT_CONFIG_GLOBAL=/dev/null \
            git -c credential.helper= -c http.extraHeader= \
            ls-remote https://github.com/vnzzzz/agent-skills.git HEAD >/dev/null
      - name: Checkout agent-skills provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vnzzzz/agent-skills
          path: repos/agent-skills
          persist-credentials: false
      - name: Validate provider metadata
        run: python3 repos/agent-skills/scripts/validate-plugin.py
      - name: Install pinned agent CLIs
        run: bash scripts/install-agent-clis.sh
      - name: Validate Claude Code Plugin
        run: claude plugin validate repos/agent-skills
      - name: Install Plugin from public default source
        run: bash scripts/install-agent-skills-plugin.sh
      - name: Re-run Plugin bootstrap from public default source
        run: bash scripts/install-agent-skills-plugin.sh
      - name: Switch Plugin marketplace source
        shell: bash
        run: cp -R repos/agent-skills /tmp/agent-skills-alternate
      - name: Reinstall from alternate source
        env:
          AGENT_SKILLS_MARKETPLACE_SOURCE: /tmp/agent-skills-alternate
        run: bash scripts/install-agent-skills-plugin.sh
      - name: Restore public default source
        run: bash scripts/install-agent-skills-plugin.sh
      - name: Verify installed Plugin
        shell: bash
        run: |
          set -Eeuo pipefail
          codex plugin list --json | grep -q 'agent-skills'
          claude plugin list --json | grep -q 'agent-skills'

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install lint tools
        run: python -m pip install -r requirements-ci.txt
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Ruff lint
        run: ruff check scripts tests templates
      - name: ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t scripts < <(find .devcontainer scripts templates -name '*.sh' -type f -print)
          if ((${#scripts[@]})); then
            shellcheck "${scripts[@]}"
          fi
      - name: GitHub Actions security lint
        run: zizmor --min-severity high .github/workflows templates/skill-repository/.github/workflows
