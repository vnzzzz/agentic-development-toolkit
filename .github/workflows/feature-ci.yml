name: feature-ci

on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "Makefile"
      - ".github/workflows/feature-ci.yml"
      - ".github/workflows/release-feature.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check documentation translation sync
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          failed=0

          while IFS= read -r source; do
            case "$source" in
              *.ja.md)
                continue
                ;;
              README.md|SECURITY.md|docs/*.md)
                mirror="${source%.md}.ja.md"
                if ! grep -Fxq "$mirror" <<<"$changed"; then
                  echo "::error::$source changed without updating $mirror"
                  failed=1
                fi
                ;;
            esac
          done <<<"$changed"

          exit "$failed"
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Validate Feature source
        run: make validate
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0
      - name: Test agent-dev Feature
        run: devcontainer features test -f agent-dev -i mcr.microsoft.com/devcontainers/base:bookworm .
